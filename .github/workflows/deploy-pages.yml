name: Deploy to GitHub Pages

on:
  push:
    branches: [react-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Supabase's anon key is designed to be public in client bundles — access
          # control is enforced server-side via Row Level Security, not by keeping
          # this secret. Without these, the deployed build has no project to talk
          # to at all: any visitor without a Settings -> Cloud Sync config saved in
          # their own browser gets "Failed to fetch" on every sign-in attempt,
          # since the app falls back to a non-existent placeholder project.
          VITE_SUPABASE_URL: https://mwgzyguymlqyvroivhsf.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13Z3p5Z3V5bWxxeXZyb2l2aHNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzQ1NjksImV4cCI6MjEwMDQ1MDU2OX0.seJUeVuOr1E3-pDQPIkhF6di8_gF0sty87sZp3dvEDg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
