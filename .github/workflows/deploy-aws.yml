name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [react-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for the deploy role

concurrency:
  group: aws-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: aws-production
      url: ${{ vars.AWS_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # GITHUB_PAGES is deliberately NOT set here. CloudFront serves the app
          # from the domain root, so vite.config.ts leaves `base` at "/" and
          # BrowserRouter's basename follows it. Setting it would produce a
          # build hardcoded to the /Expenditrack1/ subpath.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Two passes, because the right Cache-Control differs by file.
      # Pass 1: content-hashed assets, cached for a year. --delete runs here so
      # superseded chunks are removed from the bucket; the entry files are
      # excluded from it and uploaded in pass 2.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_BUCKET_NAME }}/" \
            --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "manifest.json" \
            --exclude "404.html" \
            --cache-control "public,max-age=31536000,immutable"

      # Pass 2: the unhashed entry files. These must revalidate on every load or
      # a returning visitor keeps booting the previous release.
      - name: Upload entry files
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_BUCKET_NAME }}/" \
            --exclude "*" \
            --include "index.html" \
            --include "sw.js" \
            --include "manifest.json" \
            --include "404.html" \
            --cache-control "no-cache,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*"
