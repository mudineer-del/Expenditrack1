<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A86C8" />
    <title>OGDCL | Drilling Fluids — Expenditure & Invoice Tracker</title>
    <script type="text/javascript">
      // Counterpart to public/404.html's redirect (GitHub Pages SPA
      // routing workaround): decode the re-encoded path back into a
      // real URL before the router mounts. No-op off GitHub Pages.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
