<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OGDCL | Drilling Fluids — Expenditure & Invoice Tracker</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GH Pages has no server-side
      // rewrite, so any deep link 404s here. Re-encode the path into a
      // query string and redirect to the real index.html, which decodes
      // it back via history.replaceState (see index.html).
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // "/Expenditrack1"

      var l = window.location
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
