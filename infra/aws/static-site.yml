AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static hosting for Expenditrack: private S3 origin behind CloudFront, plus a
  GitHub OIDC role so CI can deploy without long-lived AWS access keys.

Parameters:
  ProjectName:
    Type: String
    Default: expenditrack
    Description: Prefix for resource names.

  GitHubRepo:
    Type: String
    Default: mudineer-del/Expenditrack1
    Description: owner/repo allowed to assume the deploy role.

  GitHubEnvironment:
    Type: String
    Default: aws-production
    Description: >
      The GitHub Actions environment the deploy job runs in. Because the job
      declares `environment:`, GitHub issues the OIDC token with a
      `repo:OWNER/REPO:environment:NAME` subject rather than a branch subject -
      so the trust policy below matches on the environment, and the branch
      restriction is enforced by that environment's deployment branch rule.

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set false if this AWS account already has the GitHub Actions OIDC
      provider registered (an account may only have one).

  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain. Leave blank to use the *.cloudfront.net domain.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN for DomainName. MUST be issued in us-east-1 regardless
      of which region this stack runs in. Required if DomainName is set.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # Private bucket. No public access, no S3 website hosting - CloudFront reaches
  # it through Origin Access Control, so the bucket is never addressable directly.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Every deploy replaces index.html and sw.js. Without this, each old
          # version is retained and billed indefinitely.
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} static site"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

        # The piece GitHub Pages cannot do. A deep link like /invoices is not an
        # object in the bucket, so S3 answers 403/404; CloudFront rewrites that
        # to index.html with a 200 and React Router takes over. This replaces the
        # spa-github-pages 404.html redirect hack - that file still ships in
        # dist/, but is never served.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled, deliberately. The default behavior serves index.html
          # and every rewritten SPA route; caching those at the edge for a year
          # would pin returning users to a stale entry document after a deploy.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

        CacheBehaviors:
          # Vite content-hashes everything under /assets, so these are safe to
          # cache immutably: a changed file always gets a new filename.
          - PathPattern: /assets/*
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

          # sw.js is not content-hashed and decides what every returning visitor
          # sees. A cached service worker outlives the deploy that replaced it.
          - PathPattern: /sw.js
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # --- CI deploy role (GitHub OIDC, no stored access keys) -------------------

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Pinned to one repo and one environment. Without the sub
              # condition, any repository on GitHub could assume this role.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: PublishSite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasCustomDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
    Description: Add this origin to Supabase Auth redirect URLs.
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
