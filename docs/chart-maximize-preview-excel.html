<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel-style chart preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font:14px Segoe UI,Arial;color:#24344a}.sheet{max-width:1180px;margin:24px auto;background:#fff;border:1px solid #ccd7e3;border-radius:8px;box-shadow:0 8px 28px #1232;overflow:hidden}.ribbon{display:flex;gap:6px;padding:10px;background:#f7f9fc;border-bottom:1px solid #d6e0ea}.ribbon button,.tools button{border:1px solid #c7d3df;background:#fff;border-radius:4px;padding:7px 10px}.ribbon button:hover,.tools button:hover{background:#e9f2ff}.title{padding:13px 18px;font-weight:600;border-bottom:1px solid #d6e0ea}.chart{height:500px;padding:34px;position:relative;background:linear-gradient(#fff,#f8fbff)}.open{position:absolute;right:20px;top:16px}.plot{height:360px;display:flex;align-items:end;gap:7%;border-left:1px solid #9aaabd;border-bottom:1px solid #9aaabd;padding:0 4%;background:repeating-linear-gradient(to top,transparent 0 71px,#dbe4ee 72px)}.bar{flex:1;background:#4472c4;border-radius:5px 5px 0 0}.b1{height:34%}.b2{height:72%}.b3{height:50%}.b4{height:90%}.axis{display:flex;justify-content:space-around;margin:10px 3%;color:#5e7188}.overlay{display:none;position:fixed;inset:0;background:#192b4199;backdrop-filter:blur(4px);z-index:9}.overlay.show{display:flex;align-items:center;justify-content:center}.window{width:min(1300px,calc(100vw - 32px));height:min(900px,calc(100vh - 32px));background:#fff;display:grid;grid-template-rows:auto auto 1fr auto;border-radius:8px;box-shadow:0 20px 80px #0008;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #ccd7e3}.tools{display:flex;gap:6px;padding:8px 12px;background:#f6f8fb;border-bottom:1px solid #ccd7e3;flex-wrap:wrap}.tools select{border:1px solid #c7d3df;border-radius:4px;padding:7px}.large{padding:26px;background:#fbfdff;display:flex;flex-direction:column;min-height:0}.large .plot{height:100%;min-height:300px}.foot{padding:10px 16px;border-top:1px solid #ccd7e3;text-align:right}.labels{position:absolute;right:18px;top:70px;color:#536a84}.hidden{display:none}@media(max-width:700px){.window{width:calc(100vw - 12px);height:calc(100vh - 12px)}.chart{height:360px;padding:18px}.plot{height:250px}}
</style></head><body><section class="sheet"><div class="ribbon"><button onclick="openWin()">Open chart details</button><button>Filter</button><button>Refresh</button></div><div class="title">Total value (incl. tax) by Well</div><div class="chart" ondblclick="openWin()"><button class="open" onclick="openWin()">⛶ Details</button><div class="plot"><i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i><i class="bar b4"></i></div><div class="axis"><span>HAKEEM</span><span>SUJAWAL</span><span>FAKIR-1</span><span>BETTANI</span></div></div></section><div id="overlay" class="overlay" onclick="if(event.target===this)closeWin()"><section class="window"><header class="head"><b id="title">Total value (incl. tax) by Well</b><button onclick="closeWin()">✕</button></header><nav class="tools"><select id="type" onchange="changeType()"><option>Column</option><option>Bar</option><option>Line</option><option>Area</option><option>Pie</option></select><select><option>Well</option><option>Vendor</option><option>Service</option><option>Quarter</option></select><select><option>Sum of amount incl. tax</option><option>Invoice count</option><option>Amount paid</option></select><button onclick="toggle('labels')">Data labels</button><button onclick="toggle('legend')">Legend</button><button onclick="toggle('grid')">Gridlines</button><button onclick="scale(1.1)">Zoom +</button><button onclick="scale(.9)">Zoom −</button><button onclick="resetChart()">Reset</button><button onclick="alert('Export preview: PNG / PDF / XLSX')">Export</button><button onclick="print()">Print</button><button onclick="document.documentElement.requestFullscreen?.()">Fullscreen</button></nav><main class="large"><div class="labels" id="labels">■ Total</div><div class="plot" id="plot"><i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i><i class="bar b4"></i></div><div class="axis"><span>HAKEEM</span><span>SUJAWAL</span><span>FAKIR-1</span><span>BETTANI</span></div></main><footer class="foot"><button onclick="closeWin()">Close</button></footer></section></div><script>const o=document.querySelector('#overlay'),p=document.querySelector('#plot');function openWin(){o.classList.add('show')}function closeWin(){o.classList.remove('show')}function scale(n){p.style.transform=`scale(${(+(p.dataset.z||1)*n).toFixed(2)})`;p.dataset.z=(+(p.dataset.z||1)*n).toFixed(2)}function resetChart(){p.style.transform='';p.dataset.z=1}function toggle(id){document.getElementById(id).classList.toggle('hidden')}function changeType(){document.querySelectorAll('#plot .bar').forEach(x=>x.style.borderRadius=document.getElementById('type').value==='Bar'?'0 5px 5px 0':'5px 5px 0 0')}document.addEventListener('keydown',e=>e.key==='Escape'&&closeWin())</script></body></html>
