<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chart maximize interaction preview</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#24344a;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:32px}.hint{margin:0 auto 18px;max-width:1100px;color:#607086}.card{max-width:1100px;margin:auto;background:#fff;border:1px solid #dce5ee;border-radius:14px;box-shadow:0 10px 30px #24344a18;overflow:hidden}.bar{padding:16px 20px;background:linear-gradient(135deg,#f9a27d,#ffbd9c);font-weight:700}.chart{height:390px;padding:26px;position:relative;background:linear-gradient(#eef5ff,#fff)}.bars{height:270px;display:flex;align-items:end;gap:10%;border-bottom:1px solid #9aabc0;border-left:1px solid #9aabc0;padding:0 4%}.bars i{display:block;flex:1;background:#d89e35;border-radius:8px 8px 0 0}.bars i:nth-child(1){height:35%}.bars i:nth-child(2){height:80%}.bars i:nth-child(3){height:52%}.bars i:nth-child(4){height:95%}.axis{display:flex;justify-content:space-around;color:#718198;font-size:12px;margin-top:10px}.open{position:absolute;right:18px;top:16px;border:1px solid #c8d4e2;background:white;border-radius:8px;padding:7px 11px;cursor:pointer}.overlay{display:none;position:fixed;inset:0;background:#17233799;backdrop-filter:blur(5px);z-index:5}.overlay.open{display:grid;place-items:center}.dialog{width:min(1200px,calc(100vw - 48px));height:min(820px,calc(100vh - 48px));background:#fff;border-radius:16px;box-shadow:0 24px 80px #0006;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.dialog-head{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e8f0}.actions{display:flex;gap:8px}.actions button,.foot button{border:1px solid #cdd8e4;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.big-chart{padding:28px;display:grid;place-items:center;background:#f7faff}.big-chart .bars{width:90%;height:70%;max-height:520px}.foot{padding:14px 24px;border-top:1px solid #e1e8f0;display:flex;justify-content:flex-end;gap:8px}@media(max-width:700px){body{padding:12px}.dialog{width:calc(100vw - 20px);height:calc(100vh - 20px)}.chart{height:300px}}
</style>
</head>
<body>
<p class="hint"><strong>Interaction preview:</strong> double-click the chart area or use “Open details”.</p>
<section class="card"><div class="bar">Total value (incl. tax) by Well</div><div class="chart" ondblclick="openChart()"><button class="open" onclick="openChart()">Open details</button><div class="bars"><i></i><i></i><i></i><i></i></div><div class="axis"><span>HAKEEM</span><span>SUJAWAL</span><span>FAKIR-1</span><span>BETTANI</span></div></div></section>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeChart()"><section class="dialog" role="dialog" aria-modal="true" aria-label="Expanded chart"><header class="dialog-head"><strong>Total value (incl. tax) by Well</strong><div class="actions"><button onclick="zoom(1.1)">＋ Zoom</button><button onclick="zoom(.9)">− Zoom</button><button onclick="closeChart()">×</button></div></header><main class="big-chart"><div class="bars" id="bigbars"><i></i><i></i><i></i><i></i></div></main><footer class="foot"><button onclick="closeChart()">Close</button></footer></section></div>
<script>const o=document.getElementById('overlay'),b=document.getElementById('bigbars');function openChart(){o.classList.add('open')}function closeChart(){o.classList.remove('open');b.style.transform='scale(1)'}function zoom(n){b.style.transform=`scale(${(parseFloat(b.dataset.z||1)*n).toFixed(2)})`;b.dataset.z=(parseFloat(b.dataset.z||1)*n).toFixed(2)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChart()})</script>
</body></html>
